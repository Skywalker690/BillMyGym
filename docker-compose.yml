services:
  postgres:
    image: postgres:16-alpine
    container_name: billmygym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gymmax
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tiger
    ports:
      - "5432:5432"
    volumes:
      - billmygym-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gymmax"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  billmygym-postgres-data:
