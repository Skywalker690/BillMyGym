spring:
  application:
    name: gymflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymflow}
    username: ${DB_USERNAME:gymflow}
    password: ${DB_PASSWORD:gymflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:120}

gymflow:
  reminder:
    pre-expiry-days: ${REMINDER_PRE_EXPIRY_DAYS:1}
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:admin@gymflow.local}
    password: ${SUPER_ADMIN_PASSWORD:SuperAdmin@123}

---
spring:
  config:
    activate:
      on-profile: dev

---
spring:
  config:
    activate:
      on-profile: prod
