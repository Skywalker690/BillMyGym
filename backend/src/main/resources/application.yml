spring:
  profiles:
    active: local
  application:
    name: billmygym
  jackson:
    time-zone: Asia/Kolkata
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymmax}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:tiger}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_ID}
    password: ${APP_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}

google:
  client:
    id: ${GOOGLE_CLIENT_ID}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

gymflow:
  payments:
    enabled: ${GYMFLOW_PAYMENTS_ENABLED:false}
  whatsapp:
    enabled: ${GYMFLOW_WHATSAPP_ENABLED:false}
    api-url: ${GYMFLOW_WHATSAPP_API_URL:https://graph.facebook.com}
    access-token: ${GYMFLOW_WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${GYMFLOW_WHATSAPP_PHONE_NUMBER_ID:}
    business-account-id: ${GYMFLOW_WHATSAPP_BUSINESS_ACCOUNT_ID:}
    version: ${GYMFLOW_WHATSAPP_VERSION:v23.0}

app:
  rate-limit:
    enabled: true
    api:
      max-requests: 180
      window-seconds: 60
    auth:
      max-requests: 12
      window-seconds: 60
    password-reset:
      max-requests: 5
      window-seconds: 300
    notifications:
      max-requests: 60
      window-seconds: 60

