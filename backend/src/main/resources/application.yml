spring:
  profiles:
    active: local
  application:
    name: gymflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymmax}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:tiger}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:120}

gymflow:
  reminder:
    pre-expiry-days: ${REMINDER_PRE_EXPIRY_DAYS:1}
  super-admin:
    email: ${SUPER_ADMIN_EMAIL:admin@gymflow.local}
    password: ${SUPER_ADMIN_PASSWORD}


